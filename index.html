<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rana Adan Communication Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #0b0f19; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .glass-card { 
            background: rgba(16, 24, 43, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 20px; 
            padding: 40px 30px; 
            width: 100%; 
            max-width: 550px; 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1); 
        }
        .header-title { text-align: center; margin-bottom: 25px; }
        h1 { 
            color: #38bdf8; 
            font-size: 24px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7); 
        }
        .input-group { margin-bottom: 20px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #38bdf8; 
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); 
        }
        .options-group { display: flex; gap: 15px; margin-bottom: 25px; }
        .option-label { 
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; 
            padding: 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; 
            border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 500;
            transition: all 0.3s ease; 
        }
        .option-label:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .option-label input[type="radio"] { accent-color: #38bdf8; transform: scale(1.2); }
        button { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #0284c7, #38bdf8); 
            color: #fff; border: none; border-radius: 12px; font-weight: bold; 
            cursor: pointer; transition: all 0.3s ease; font-size: 18px; 
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6); }
        #status { margin-top: 20px; text-align: center; font-size: 15px; color: #cbd5e1; min-height: 24px; }
        .footer { text-align: center; margin-top: 30px; font-size: 13px; color: #94a3b8; letter-spacing: 2px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="header-title">
            <h1>Rana Adan Communication Downloader</h1>
        </div>
        
        <div class="input-group">
            <input type="text" id="mediaQuery" placeholder="Koi Name (e.g. Punjabi movie) ya Link likhein...">
        </div>
        
        <div class="input-group">
            <input type="number" id="limitCount" placeholder="Kitni files download karni hain? (e.g., 5, 10, 50)" min="1" max="1000" value="5">
        </div>
        
        <div class="options-group">
            <label class="option-label">
                <input type="radio" name="format" value="video" checked> 🎬 Video
            </label>
            <label class="option-label">
                <input type="radio" name="format" value="audio"> 🎵 Audio
            </label>
        </div>
        
        <button onclick="startDownload()">Download ZIP</button>
        <div id="status"></div>

        <div class="footer">
            POWERED BY RANA SHAHID
        </div>
    </div>

    <script>
        const HEROKU_BACKEND_URL = "https://ranashaahid-928b483d7ba9.herokuapp.com";

        function startDownload() {
            const query = document.getElementById('mediaQuery').value.trim();
            const format = document.querySelector('input[name="format"]:checked').value;
            const limit = document.getElementById('limitCount').value;
            const statusDiv = document.getElementById('status');

            if (!query) {
                statusDiv.innerHTML = "❌ Meharbani karke koi Naam ya Link darj karein!";
                statusDiv.style.color = "#ef4444";
                return;
            }

            statusDiv.innerHTML = `⏳ Backend par downloading shuru ho gayi hai. ZIP file khud ba khud download ho jayegi...`;
            statusDiv.style.color = "#38bdf8";

            // Browser mein direct URL open karne se downloading trigger hogi
            const downloadUrl = `${HEROKU_BACKEND_URL}/api/download?q=${encodeURIComponent(query)}&format=${format}&limit=${limit}`;
            window.location.href = downloadUrl;
            
            setTimeout(() => {
                statusDiv.innerHTML = "✅ ZIP taiyar ho rahi hai, meharbani karke browser check karein!";
                statusDiv.style.color = "#22c55e";
            }, 5000);
        }
    </script>
</body>
</html>
