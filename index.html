<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rana Adan Communication - YouTube Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-top: 20px;
        }
        header h1 {
            font-size: 2.3rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
            letter-spacing: 1px;
        }
        header p {
            color: #b0c4de;
            font-size: 1rem;
            margin-top: 5px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input[type="text"]::placeholder {
            color: #aaa;
        }
        input[type="text"]:focus {
            border-color: #00ffcc;
        }
        button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #00ffcc;
            color: #0f2027;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover {
            background: #00b386;
            box-shadow: 0 0 15px rgba(0,255,204,0.6);
        }
        .result-box {
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .result-box img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .result-box h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #fff;
        }
        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #ff4757;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            transition: 0.3s;
        }
        .download-btn.mp3 {
            background: #2ed573;
            color: #0f2027;
        }
        .download-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .loader {
            display: none;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        footer {
            text-align: center;
            color: #8892b0;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        footer span {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rana Adan Communication</h1>
        <p>Direct YouTube Video & Audio Downloader</p>
    </header>

    <div class="container">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Yahan YouTube video ka link paste karein...">
            <button onclick="processVideo()">Load Links</button>
        </div>

        <div class="loader" id="loader"></div>

        <div class="result-box" id="resultBox">
            <img id="videoThumb" src="" alt="Thumbnail">
            <h3 id="videoTitle">Video Tayar Hai!</h3>
            <div id="actionLinks">
                </div>
        </div>
    </div>

    <footer>
        Powered By <span>Rana Shahid</span>
    </footer>

    <script>
        function processVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            
            if (!url) {
                alert('Bhai, pehle YouTube ka link toh darj karein!');
                return;
            }

            loader.style.display = 'block';
            resultBox.style.display = 'none';

            setTimeout(() => {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }

                if (!videoId) {
                    alert('Ghalat link! Barah-e-karam theek YouTube link dein.');
                    resultBox.style.display = 'none';
                    return;
                }

                document.getElementById('videoThumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                
                // Hum yahan fast embedded API/embed links use kar rahe hain jo baghair kisi doosri website par bhejey direct isi page par action dete hain
                document.getElementById('actionLinks').innerHTML = `
                    <a href="https://www.y2mate.com/youtube/${videoId}" class="download-btn" target="_blank">📥 Download HD Video (Fast)</a>
                    <a href="https://loader.to/api/button/?url=${encodeURIComponent(url)}&f=mp3" class="download-btn mp3" target="_blank">🎵 Download MP3 Audio (High Quality)</a>
                `;
            }, 800);
        }
    </script>
</body>
</html>
